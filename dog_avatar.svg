<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Warmth Gradient -->
    <linearGradient id="bgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="50%" stop-color="#FEF8ED"/>
      <stop offset="100%" stop-color="#FEF6EA"/>
    </linearGradient>

    <!-- Star Sparkle Gradient -->
    <linearGradient id="starGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FEDD58"/>
      <stop offset="30%" stop-color="#F6A71E"/>
      <stop offset="70%" stop-color="#DE830E"/>
      <stop offset="100%" stop-color="#BF6303"/>
    </linearGradient>

    <!-- Head Radial Gradient with Light from Upper-Left -->
    <radialGradient id="headGrad" cx="37%" cy="31%" r="68%">
      <stop offset="0%" stop-color="#9C5D2F"/>
      <stop offset="35%" stop-color="#844B24"/>
      <stop offset="70%" stop-color="#673618"/>
      <stop offset="100%" stop-color="#46220E"/>
    </radialGradient>

    <!-- Left Ear Gradient -->
    <radialGradient id="leftEarGrad" cx="32%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8B532B"/>
      <stop offset="40%" stop-color="#734220"/>
      <stop offset="80%" stop-color="#562F16"/>
      <stop offset="100%" stop-color="#411F0D"/>
    </radialGradient>

    <!-- Right Ear Gradient -->
    <radialGradient id="rightEarGrad" cx="48%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#834D27"/>
      <stop offset="40%" stop-color="#6E3E1E"/>
      <stop offset="80%" stop-color="#542D15"/>
      <stop offset="100%" stop-color="#3D1D0C"/>
    </radialGradient>

    <!-- Muzzle Cream Gradient -->
    <radialGradient id="muzzleGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="85%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFF8EC"/>
    </radialGradient>

    <!-- Nose Gradient -->
    <linearGradient id="noseGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3C2A22"/>
      <stop offset="100%" stop-color="#221610"/>
    </linearGradient>

    <!-- Collar Leather Gradient -->
    <linearGradient id="collarGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#382419"/>
      <stop offset="100%" stop-color="#1E120B"/>
    </linearGradient>

    <!-- Gold Trim / Stud Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE182"/>
      <stop offset="30%" stop-color="#EAA936"/>
      <stop offset="70%" stop-color="#C27A18"/>
      <stop offset="100%" stop-color="#8E4E09"/>
    </linearGradient>

    <!-- Tag Casing Gold Metallic Gradient -->
    <linearGradient id="tagGoldGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ECC166"/>
      <stop offset="25%" stop-color="#FDE894"/>
      <stop offset="50%" stop-color="#DB9624"/>
      <stop offset="80%" stop-color="#B26A12"/>
      <stop offset="100%" stop-color="#6F3905"/>
    </linearGradient>

    <!-- Tag Inner Bevel Line -->
    <linearGradient id="tagInnerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#552B07"/>
      <stop offset="100%" stop-color="#2D1503"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Left Ear Flap -->
  <path fill="url(#leftEarGrad)" d="
    M 334 220
    C 280 235, 230 285, 204 360
    C 174 425, 172 490, 182 540
    C 194 580, 222 607, 260 607
    C 305 607, 345 565, 370 510
    C 388 470, 392 420, 382 360
    Z
  "/>

  <!-- Right Ear Flap -->
  <path fill="url(#rightEarGrad)" d="
    M 690 220
    C 744 235, 794 285, 820 360
    C 850 425, 852 490, 842 540
    C 830 580, 802 607, 764 607
    C 719 607, 679 565, 654 510
    C 636 470, 632 420, 642 360
    Z
  "/>

  <!-- Head Silhouette -->
  <circle cx="511.5" cy="432" r="276" fill="url(#headGrad)"/>

  <!-- 4-Point Sparkle Star with Center Cutout -->
  <path fill="url(#starGrad)" fill-rule="evenodd" d="
    M 720.5 92
    Q 723 150 782 156
    Q 723 162 720.5 220
    Q 718 162 659 156
    Q 718 150 720.5 92
    Z
    M 720.5 142.5
    A 13.5 13.5 0 1 0 720.5 169.5
    A 13.5 13.5 0 1 0 720.5 142.5
    Z
  "/>

  <!-- Snout / Muzzle -->
  <ellipse cx="509.5" cy="505.5" rx="154" ry="122.5" fill="url(#muzzleGrad)"/>

  <!-- Left Eye -->
  <circle cx="406.5" cy="383" r="27.5" fill="#2E1C13"/>
  <circle cx="395" cy="371" r="10.5" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <circle cx="613.5" cy="383" r="27.5" fill="#2E1C13"/>
  <circle cx="602" cy="371" r="10.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <path fill="url(#noseGrad)" d="
    M 462 449
    C 460 435, 474 432, 492 434
    C 502 435, 506 438, 509.5 440
    C 513 438, 517 435, 527 434
    C 545 432, 559 435, 557 449
    C 555 465, 538 488, 523 502
    C 517 508, 513 510, 509.5 510
    C 506 510, 502 508, 496 502
    C 481 488, 464 465, 462 449
    Z
  "/>
  <!-- Nose Catchlight / Highlight -->
  <ellipse cx="482" cy="444" rx="15" ry="6" transform="rotate(-10 482 444)" fill="#CCD1DB" opacity="0.8"/>

  <!-- Collar Leather Strap -->
  <path fill="url(#collarGrad)" stroke="#B37320" stroke-width="4.5" stroke-linejoin="round" d="
    M 360 623
    C 405 657, 458 674, 511.5 674
    C 565 674, 618 657, 663 623
    L 695 667
    C 644 706, 580 728, 511.5 728
    C 443 728, 379 706, 328 667
    Z
  "/>

  <!-- Collar Stitching (Dashed Gold Thread) -->
  <path fill="none" stroke="#EBB646" stroke-width="3.5" stroke-dasharray="9, 7" stroke-linecap="round" d="
    M 344 645
    C 392 682, 451 701, 511.5 701
    C 572 701, 631 682, 679 645
  "/>

  <!-- Left Collar Rivet / Grommet -->
  <circle cx="371.2" cy="654.3" r="11" fill="url(#goldGrad)"/>
  <circle cx="371.2" cy="654.3" r="5" fill="#281A12"/>

  <!-- Right Collar Rivet / Grommet -->
  <circle cx="641.8" cy="654.0" r="11" fill="url(#goldGrad)"/>
  <circle cx="641.8" cy="654.0" r="5" fill="#281A12"/>

  <!-- Gold Ring / Tag Bail Connector -->
  <path fill="url(#tagGoldGrad)" fill-rule="evenodd" d="
    M 495 696
    L 528 696
    L 528 726
    C 528 738, 521 744, 511.5 744
    C 502 744, 495 738, 495 726
    Z
    M 505 704
    L 518 704
    L 518 725
    C 518 729, 515 732, 511.5 732
    C 508 732, 505 729, 505 725
    Z
  "/>

  <!-- Tag Pendant Body -->
  <!-- Outer Gold Bezel -->
  <rect x="420" y="727" width="183" height="200" rx="38" ry="38" fill="url(#tagGoldGrad)"/>
  <!-- Inner Dark Bevel -->
  <rect x="426" y="733" width="171" height="188" rx="32" ry="32" fill="url(#tagInnerBevel)"/>
  <!-- Cream Face -->
  <rect x="435" y="738" width="153" height="174" rx="26" ry="26" fill="#FFFDF7"/>

  <!-- Tag Top Mini Star (Gold 5-Point Star) -->
  <polygon fill="#F0A319" points="
    511.5,748.5 514.0,754.2 520.1,754.7 515.5,758.8 516.9,764.8 
    511.5,761.6 506.1,764.8 507.5,758.8 502.9,754.7 509.0,754.2
  "/>

  <!-- QR Finder Patterns -->
  <!-- Top-Left Finder -->
  <rect x="442" y="778" width="40" height="40" rx="8" fill="#331E15"/>
  <rect x="450" y="786" width="24" height="24" rx="4" fill="#FFFDF7"/>
  <rect x="455" y="791" width="14" height="14" rx="3" fill="#331E15"/>

  <!-- Top-Right Finder -->
  <rect x="542" y="778" width="40" height="40" rx="8" fill="#331E15"/>
  <rect x="550" y="786" width="24" height="24" rx="4" fill="#FFFDF7"/>
  <rect x="555" y="791" width="14" height="14" rx="3" fill="#331E15"/>

  <!-- Bottom-Left Finder -->
  <rect x="442" y="854" width="40" height="40" rx="8" fill="#331E15"/>
  <rect x="450" y="862" width="24" height="24" rx="4" fill="#FFFDF7"/>
  <rect x="455" y="867" width="14" height="14" rx="3" fill="#331E15"/>

  <!-- QR Code Stylized Modules and Golden Accents -->
  <!-- Center Column Top Dot -->
  <rect x="506" y="807" width="12" height="12" rx="3" fill="#331E15"/>
  <!-- Center Column Middle Gold Accent Dot -->
  <rect x="502" y="831" width="12" height="12" rx="3" fill="#E59816"/>
  <!-- Col 4 Top Dot -->
  <rect x="530" y="831" width="12" height="12" rx="3" fill="#331E15"/>
  <!-- Col 5 Top Dot -->
  <rect x="557" y="831" width="12" height="12" rx="3" fill="#331E15"/>
  <!-- Col 5 Middle Dot -->
  <rect x="556" y="853" width="12" height="12" rx="3" fill="#331E15"/>
  <!-- Col 4 Bottom Dot -->
  <rect x="530" y="878" width="13" height="13" rx="3" fill="#331E15"/>
  <!-- Col 5 Bottom Gold Accent Dot -->
  <rect x="556" y="877" width="12" height="12" rx="3" fill="#E59816"/>
</svg>