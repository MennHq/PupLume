<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PupLume — AI Puppy Manager</title>
    <meta name="description" content="Intelligent, warm, mobile-first AI puppy manager for training, routines, health records, potty tracking, and daily care." />
    <meta property="og:title" content="PupLume — AI Puppy Manager" />
    <meta property="og:description" content="Intelligent, warm, mobile-first AI puppy manager for training, routines, health records, potty tracking, and daily care." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8B5E3C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PupLume" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Typography: Preconnect + Non-blocking display=swap font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap">
    </noscript>
  </head>
  <body class="bg-[#FFF9F2] text-[#2C211B] antialiased selection:bg-[#E9B89C] selection:text-[#2C211B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Lock mobile viewport: block pinch-to-zoom on iOS/WebKit
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });

      // Automatically clean up stale dev service workers that cause blank screens
      if ('serviceWorker' in navigator) {
        const isDev = window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1' || 
                      window.location.hostname.startsWith('192.168.');
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let reg of registrations) {
              reg.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) caches.delete(name);
            });
          }
        } else if (window.location.protocol === 'https:') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((err) => {
              console.log('SW registration note:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
