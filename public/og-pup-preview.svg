<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Warm Skin / Cream Tone Background (Zero Dark Brown) -->
    <linearGradient id="pupSkinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="40%" stop-color="#FFF9F2"/>
      <stop offset="85%" stop-color="#FAF2E6"/>
      <stop offset="100%" stop-color="#F5E8D8"/>
    </linearGradient>
    <radialGradient id="pupPeachGlow" cx="18%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FCDDC7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF9F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pupAmberGlow" cx="80%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFF9F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoPupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A27046"/>
      <stop offset="100%" stop-color="#734927"/>
    </linearGradient>
    <linearGradient id="logoLumeStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2C211B" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2C211B" flood-opacity="0.04"/>
    </filter>
    <clipPath id="heroPhotoClip">
      <rect x="0" y="0" width="440" height="470" rx="36" />
    </clipPath>
  </defs>

  <!-- Clean Warm Skin Background (Seamless Canvas) -->
  <rect width="1200" height="630" fill="url(#pupSkinBg)"/>
  <rect width="1200" height="630" fill="url(#pupPeachGlow)"/>
  <rect width="1200" height="630" fill="url(#pupAmberGlow)"/>

  <!-- Left Side: Hero Pet Photo (Borderless, Direct on Canvas, Zero Nested Boxes) -->
  <g transform="translate(85, 80)" filter="url(#softCardShadow)">
    <rect width="440" height="470" rx="36" fill="#FBF3EB"/>
    <g clip-path="url(#heroPhotoClip)">
      <rect width="440" height="470" fill="#FAF0E4"/>
      <text id="heroPhotoEmoji" x="220" y="275" font-size="150" text-anchor="middle">🐶</text>
    </g>
    
    <!-- Verified Emerald Badge on Top Right of Photo -->
    <g transform="translate(370, 20)">
      <circle cx="25" cy="25" r="24" fill="#059669" stroke="#FFFFFF" stroke-width="3"/>
      <text x="25" y="33" font-size="20" text-anchor="middle" fill="#FFFFFF" font-family="Outfit" font-weight="900">✓</text>
    </g>
  </g>

  <!-- Right Side: Editorial Passport Typography (Seamless, Zero Boxes) -->
  <g transform="translate(575, 80)">
    <!-- Official PupLume Brand Header -->
    <g transform="translate(0, 0)">
      <!-- Official Squircle Icon (52x52) -->
      <rect width="52" height="52" rx="16" fill="url(#logoPupGrad)" filter="url(#softCardShadow)"/>
      <g transform="translate(0, -2) scale(0.11)">
        <path d="M 120 120 C 60 140 30 210 40 290 C 45 320 70 340 95 325 C 115 310 135 250 140 200 Z" fill="#5F3E29" />
        <path d="M 320 120 C 380 140 410 210 400 290 C 395 320 370 340 345 325 C 325 310 305 250 300 200 Z" fill="#5F3E29" />
        <ellipse cx="220" cy="275" rx="85" ry="70" fill="#FFF9F2" />
        <path d="M 195 240 C 195 230 245 230 245 240 C 245 258 228 272 220 272 C 212 272 195 258 195 240 Z" fill="#2C211B" />
        <ellipse cx="212" cy="238" rx="6" ry="3" fill="#FFFFFF" opacity="0.6" />
        <circle cx="165" cy="205" r="14" fill="#2C211B" />
        <circle cx="161" cy="201" r="5" fill="#FFFFFF" />
        <circle cx="275" cy="205" r="14" fill="#2C211B" />
        <circle cx="271" cy="201" r="5" fill="#FFFFFF" />
        <g transform="translate(295, 45)">
          <path d="M 40 0 C 40 22 58 40 80 40 C 58 40 40 58 40 80 C 40 58 22 40 0 40 C 22 40 40 22 40 0 Z" fill="url(#logoLumeStar)" />
          <circle cx="40" cy="40" r="10" fill="#FFF9F2" />
        </g>
      </g>

      <!-- Wordmark in Grandstander font -->
      <text x="68" y="32" font-family="Grandstander" font-size="34" font-weight="900" fill="#2C211B" letter-spacing="-0.5">
        Pup<tspan fill="#8B5E3C">Lume</tspan>
      </text>
      <text x="70" y="50" font-family="Outfit" font-size="11" font-weight="800" fill="#766A63" letter-spacing="3">
        VERIFIED DIGITAL PET PASSPORT
      </text>
    </g>

    <!-- Pet Name in Bold Grandstander -->
    <text id="pupNameText" x="0" y="145" font-family="Grandstander" font-size="68" font-weight="900" fill="#2C211B" letter-spacing="-1.5">Bella</text>

    <!-- Breed & Details -->
    <text id="pupBreedText" x="0" y="188" font-family="Grandstander" font-size="26" font-weight="700" fill="#8B5E3C">Golden Retriever • 6 months old</text>

    <!-- Status Highlights directly on canvas -->
    <g transform="translate(0, 238)">
      <circle cx="6" cy="-5" r="4" fill="#059669" />
      <text x="18" y="0" font-family="Outfit" font-size="18" font-weight="800" fill="#2E7D32">
        Active Collar Tag
      </text>

      <circle cx="180" cy="-5" r="4" fill="#059669" />
      <text x="192" y="0" font-family="Outfit" font-size="18" font-weight="800" fill="#2E7D32">
        Vaccinated
      </text>

      <circle cx="316" cy="-5" r="4" fill="#059669" />
      <text x="328" y="0" font-family="Outfit" font-size="18" font-weight="800" fill="#2E7D32">
        Emergency Ready
      </text>
    </g>

    <!-- Microchip & Temperament -->
    <g transform="translate(0, 282)">
      <text x="0" y="0" font-family="Outfit" font-size="14" font-weight="800" fill="#766A63" letter-spacing="1.5">
        MICROCHIP ID:
      </text>
      <text id="pupChipText" x="135" y="0" font-family="Outfit" font-size="17" font-weight="800" fill="#2C211B">985-141-002-841-920</text>

      <text x="0" y="36" font-family="Outfit" font-size="14" font-weight="800" fill="#766A63" letter-spacing="1.5">
        CARE NOTES:
      </text>
      <text id="pupNotesText" x="120" y="36" font-family="Outfit" font-size="16" font-weight="600" fill="#5F3E29">Friendly, energetic, and loves children</text>
    </g>

    <!-- Bottom QR Tag & URL -->
    <g transform="translate(0, 400)">
      <text x="0" y="0" font-family="Grandstander" font-size="28" font-weight="900" fill="#2C211B">
        puplumepet.vercel.app
      </text>
      <text x="0" y="26" font-family="Outfit" font-size="15" font-weight="600" fill="#766A63">
        Scan collar tag for live emergency contacts &amp; medical vault
      </text>
    </g>
  </g>
</svg>
