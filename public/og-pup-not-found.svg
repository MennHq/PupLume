<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Warm Skin / Cream Tone Background (Zero Dark Brown) -->
    <linearGradient id="errSkinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="45%" stop-color="#FFF9F2"/>
      <stop offset="100%" stop-color="#FCEEE6"/>
    </linearGradient>
    <radialGradient id="errPeachGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFF9F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoPupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A27046"/>
      <stop offset="100%" stop-color="#734927"/>
    </linearGradient>
    <linearGradient id="logoLumeStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
    <filter id="errSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2C211B" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C211B" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- Clean Warm Skin Background -->
  <rect width="1200" height="630" fill="url(#errSkinBg)"/>
  <rect width="1200" height="630" fill="url(#errPeachGlow)"/>

  <!-- Top Center Brand Header (Official PupLume Logo + Textual Logo) -->
  <g transform="translate(460, 65)">
    <!-- Official Squircle Icon (56x56) -->
    <rect width="56" height="56" rx="18" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="1.5" filter="url(#errSoftShadow)"/>
    <g transform="translate(3, 2) scale(0.105)">
      <path d="M 220 80 C 130 80 70 140 70 240 C 70 330 140 380 220 380 C 300 380 370 330 370 240 C 370 140 310 80 220 80 Z" fill="url(#logoPupGrad)" />
      <path d="M 120 120 C 60 140 30 210 40 290 C 45 320 70 340 95 325 C 115 310 135 250 140 200 Z" fill="#5F3E29" />
      <path d="M 320 120 C 380 140 410 210 400 290 C 395 320 370 340 345 325 C 325 310 305 250 300 200 Z" fill="#5F3E29" />
      <ellipse cx="220" cy="275" rx="85" ry="70" fill="#FFF9F2" />
      <path d="M 195 240 C 195 230 245 230 245 240 C 245 258 228 272 220 272 C 212 272 195 258 195 240 Z" fill="#2C211B" />
      <ellipse cx="212" cy="238" rx="6" ry="3" fill="#FFFFFF" opacity="0.6" />
      <circle cx="165" cy="205" r="14" fill="#2C211B" />
      <circle cx="161" cy="201" r="5" fill="#FFFFFF" />
      <circle cx="275" cy="205" r="14" fill="#2C211B" />
      <circle cx="271" cy="201" r="5" fill="#FFFFFF" />
      <g transform="translate(295, 45)">
        <path d="M 40 0 C 40 22 58 40 80 40 C 58 40 40 58 40 80 C 40 58 22 40 0 40 C 22 40 40 22 40 0 Z" fill="url(#logoLumeStar)" />
        <circle cx="40" cy="40" r="10" fill="#FFF9F2" />
      </g>
    </g>

    <!-- Wordmark in Grandstander font -->
    <text x="74" y="34" font-family="Grandstander, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#2C211B" letter-spacing="-0.5">
      Pup<tspan fill="#8B5E3C">Lume</tspan>
    </text>
    <text x="76" y="52" font-family="Grandstander, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#766A63" letter-spacing="3">
      SAFETY COLLAR TAG NETWORK
    </text>
  </g>

  <!-- Center Editorial Area (No Nested Boxes) -->
  <g transform="translate(600, 260)">
    <!-- Alert Icon -->
    <text x="0" y="0" font-size="52" text-anchor="middle">🔍</text>

    <!-- Headline in Bold Grandstander -->
    <text x="0" y="60" font-family="Grandstander, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#2C211B" text-anchor="middle" letter-spacing="-1">
      Puppy Passport Not Found
    </text>

    <!-- Subtitle (Clean & Friendly) -->
    <text x="0" y="105" font-family="Grandstander, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#766A63" text-anchor="middle">
      This collar tag or passport link is inactive, mistyped, or not yet registered.
    </text>

    <!-- Direct Guidance (No Nested Box) -->
    <text x="0" y="150" font-family="Grandstander, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#8B5E3C" text-anchor="middle">
      ⚠️ If you found this pet, please verify the QR code on the physical collar tag.
    </text>

    <!-- URL in Brand Bronze -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" font-family="Grandstander, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#8B5E3C" text-anchor="middle">
        puplumepet.vercel.app &#8594;
      </text>
    </g>
  </g>
</svg>
