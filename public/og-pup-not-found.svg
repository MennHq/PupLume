<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="errLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#FCEEE8"/>
    </linearGradient>
    <radialGradient id="errRoseGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FECACA" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FED7AA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoPupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A27046"/>
      <stop offset="100%" stop-color="#734927"/>
    </linearGradient>
    <linearGradient id="logoLumeStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
    <!-- Clean Crisp Drop Shadow -->
    <filter id="errCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2C211B" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2C211B" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Clean Light Mode Background -->
  <rect width="1200" height="630" fill="url(#errLightBg)"/>
  <rect width="1200" height="630" fill="url(#errRoseGlow)"/>

  <!-- Top Brand Navigation (Official PupLume Logo + Textual Logo) -->
  <g transform="translate(80, 50)">
    <!-- Official Squircle Icon -->
    <rect width="52" height="52" rx="15" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="2" filter="url(#errCardShadow)"/>
    <g transform="translate(3, 2) scale(0.10)">
      <path d="M 220 80 C 130 80 70 140 70 240 C 70 330 140 380 220 380 C 300 380 370 330 370 240 C 370 140 310 80 220 80 Z" fill="url(#logoPupGrad)" />
      <path d="M 120 120 C 60 140 30 210 40 290 C 45 320 70 340 95 325 C 115 310 135 250 140 200 Z" fill="#5F3E29" />
      <path d="M 320 120 C 380 140 410 210 400 290 C 395 320 370 340 345 325 C 325 310 305 250 300 200 Z" fill="#5F3E29" />
      <ellipse cx="220" cy="275" rx="85" ry="70" fill="#FFF9F2" />
      <path d="M 195 240 C 195 230 245 230 245 240 C 245 258 228 272 220 272 C 212 272 195 258 195 240 Z" fill="#2C211B" />
      <ellipse cx="212" cy="238" rx="6" ry="3" fill="#FFFFFF" opacity="0.6" />
      <circle cx="165" cy="205" r="14" fill="#2C211B" />
      <circle cx="161" cy="201" r="5" fill="#FFFFFF" />
      <circle cx="275" cy="205" r="14" fill="#2C211B" />
      <circle cx="271" cy="201" r="5" fill="#FFFFFF" />
      <g transform="translate(295, 45)">
        <path d="M 40 0 C 40 22 58 40 80 40 C 58 40 40 58 40 80 C 40 58 22 40 0 40 C 22 40 40 22 40 0 Z" fill="url(#logoLumeStar)" />
        <circle cx="40" cy="40" r="10" fill="#FFF9F2" />
      </g>
    </g>

    <!-- Official Textual Logo -->
    <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#2C211B" letter-spacing="-0.5">
      Pup<tspan fill="#8B5E3C">Lume</tspan>
    </text>
    <text x="70" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#766A63" letter-spacing="2.5">
      SAFETY COLLAR TAG NETWORK
    </text>
  </g>

  <!-- Centered Clean Card in Pure White -->
  <g transform="translate(160, 125)" filter="url(#errCardShadow)">
    <rect width="880" height="425" rx="36" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="2.5"/>

    <!-- Search/Alert Icon Badge -->
    <g transform="translate(390, 40)">
      <circle cx="50" cy="50" r="46" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
      <text x="50" y="62" font-size="44" text-anchor="middle">🔍</text>
    </g>

    <!-- Headline in Charcoal -->
    <text x="440" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#2C211B" text-anchor="middle" letter-spacing="-0.5">
      Puppy Passport Not Found
    </text>

    <!-- Subtitle in Warm Muted -->
    <text x="440" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#766A63" text-anchor="middle">
      This collar tag or passport link is inactive, mistyped, or not yet registered.
    </text>

    <!-- Info Box -->
    <g transform="translate(100, 255)">
      <rect width="680" height="75" rx="18" fill="#FAF6F0" stroke="#E8DDD3" stroke-width="1.5"/>
      <text x="340" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#8B5E3C" text-anchor="middle" letter-spacing="1">
        ⚠️ PET STATUS: UNREGISTERED / LINK EXPIRED
      </text>
      <text x="340" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#5F3E29" text-anchor="middle">
        If you found this pet, please verify the QR code on the physical collar tag.
      </text>
    </g>

    <!-- Action Prompt in PupLume Bronze -->
    <g transform="translate(300, 355)">
      <rect width="280" height="42" rx="21" fill="#8B5E3C"/>
      <text x="140" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">
        Visit puplumepet.vercel.app &#8594;
      </text>
    </g>
  </g>
</svg>
