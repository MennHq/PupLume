<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="errBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1510"/>
      <stop offset="50%" stop-color="#2A1813"/>
      <stop offset="100%" stop-color="#170F0B"/>
    </linearGradient>
    <radialGradient id="errGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="errCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#errBg)"/>
  <rect width="1200" height="630" fill="url(#errGlow)"/>

  <!-- Top Brand Navigation -->
  <g transform="translate(80, 55)">
    <rect width="250" height="38" rx="19" fill="rgba(243, 231, 218, 0.12)" stroke="rgba(243, 231, 218, 0.25)" stroke-width="1.5"/>
    <text x="24" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#F3E7DA" letter-spacing="2">🐾 PUPLUME PASSPORT</text>
  </g>

  <!-- Centered Error Card -->
  <g transform="translate(180, 115)" filter="url(#errCardShadow)">
    <rect width="840" height="430" rx="36" fill="#FAF6F0" stroke="#F87171" stroke-width="2"/>

    <!-- Error Icon Pill -->
    <g transform="translate(370, 45)">
      <circle cx="50" cy="50" r="48" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="3"/>
      <text x="50" y="62" font-size="44" text-anchor="middle">🔍</text>
    </g>

    <!-- Error Headline -->
    <text x="420" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#2C211B" text-anchor="middle" letter-spacing="-0.5">
      Puppy Passport Not Found
    </text>

    <!-- Error Subtext -->
    <text x="420" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#766A63" text-anchor="middle">
      This collar tag or passport link is inactive, mistyped, or not yet registered.
    </text>

    <!-- Details Box -->
    <g transform="translate(90, 265)">
      <rect width="660" height="70" rx="18" fill="#FFF9F2" stroke="#E8DDD3" stroke-width="1.5"/>
      <text x="330" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#8B5E3C" text-anchor="middle">
        ⚠️ PET PASSPORT STATUS: UNREGISTERED / INVALID
      </text>
      <text x="330" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#A8988D" text-anchor="middle">
        If you found this pet, please verify the QR code on the tag or visit puplume.pet
      </text>
    </g>

    <!-- Footer Action Prompt -->
    <text x="420" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#D97706" text-anchor="middle">
      Visit puplume.pet to register a puppy or contact support &#8594;
    </text>
  </g>
</svg>
