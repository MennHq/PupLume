<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Warm Skin / Alabaster Background -->
    <linearGradient id="c1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FFF9F2"/>
      <stop offset="100%" stop-color="#FAF1E6"/>
    </linearGradient>
    <radialGradient id="c1Peach" cx="20%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FCDDC7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF9F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c1Amber" cx="85%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFF9F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoPupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A27046"/>
      <stop offset="100%" stop-color="#734927"/>
    </linearGradient>
    <linearGradient id="logoLumeStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="c1Shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2C211B" flood-opacity="0.09"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2C211B" flood-opacity="0.03"/>
    </filter>
    <clipPath id="c1PhotoClip">
      <rect width="450" height="470" rx="36" />
    </clipPath>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1200" height="630" fill="url(#c1Bg)"/>
  <rect width="1200" height="630" fill="url(#c1Peach)"/>
  <rect width="1200" height="630" fill="url(#c1Amber)"/>

  <!-- Left: Borderless Photo with Soft Lift -->
  <g transform="translate(85, 80)" filter="url(#c1Shadow)">
    <g clip-path="url(#c1PhotoClip)">
      <rect width="450" height="470" fill="#FAF0E4"/>
      <!-- Photo replaced dynamically by script -->
      <text id="c1PhotoPlaceholder" x="225" y="275" font-size="140" text-anchor="middle">🐶</text>
    </g>
    <!-- Verified Emerald Badge -->
    <g transform="translate(380, 24)">
      <circle cx="22" cy="22" r="22" fill="#059669" stroke="#FFFFFF" stroke-width="3"/>
      <text x="22" y="29" font-size="18" text-anchor="middle" fill="#FFFFFF" font-family="Grandstander" font-weight="900">✓</text>
    </g>
  </g>

  <!-- Right: Pure Editorial Typography (Zero Boxes) -->
  <g transform="translate(585, 80)">
    <!-- Header: Wordmark & Category -->
    <g transform="translate(0, 0)">
      <rect width="52" height="52" rx="16" fill="url(#logoPupGrad)" filter="url(#c1Shadow)"/>
      <g transform="translate(1, -2) scale(0.11)">
        <path d="M 120 120 C 60 140 30 210 40 290 C 45 320 70 340 95 325 C 115 310 135 250 140 200 Z" fill="#5F3E29" />
        <path d="M 320 120 C 380 140 410 210 400 290 C 395 320 370 340 345 325 C 325 310 305 250 300 200 Z" fill="#5F3E29" />
        <ellipse cx="220" cy="275" rx="85" ry="70" fill="#FFF9F2" />
        <path d="M 195 240 C 195 230 245 230 245 240 C 245 258 228 272 220 272 C 212 272 195 258 195 240 Z" fill="#2C211B" />
        <ellipse cx="212" cy="238" rx="6" ry="3" fill="#FFFFFF" opacity="0.6" />
        <circle cx="165" cy="205" r="14" fill="#2C211B" />
        <circle cx="161" cy="201" r="5" fill="#FFFFFF" />
        <circle cx="275" cy="205" r="14" fill="#2C211B" />
        <circle cx="271" cy="201" r="5" fill="#FFFFFF" />
        <g transform="translate(295, 45)">
          <path d="M 40 0 C 40 22 58 40 80 40 C 58 40 40 58 40 80 C 40 58 22 40 0 40 C 22 40 40 22 40 0 Z" fill="url(#logoLumeStar)" />
          <circle cx="40" cy="40" r="10" fill="#FFF9F2" />
        </g>
      </g>

      <text x="70" y="34" font-family="Grandstander" font-size="38" font-weight="900" fill="#2C211B" letter-spacing="-0.5">
        Pup<tspan fill="#8B5E3C">Lume</tspan>
      </text>
      <text x="72" y="52" font-family="Grandstander" font-size="12" font-weight="700" fill="#766A63" letter-spacing="2.5">
        VERIFIED DIGITAL PET PASSPORT
      </text>
    </g>

    <!-- Pet Name (Huge, Bold, High Legibility) -->
    <text x="0" y="152" font-family="Grandstander" font-size="82" font-weight="900" fill="#2C211B" letter-spacing="-2">Graxzo</text>

    <!-- Breed & Attributes (Medium-Bold) -->
    <text x="0" y="198" font-family="Grandstander" font-size="30" font-weight="700" fill="#8B5E3C">German Shepherd • 12 lbs • 6 mo</text>

    <!-- Clean Status Indicators -->
    <g transform="translate(0, 246)">
      <circle cx="6" cy="-6" r="5" fill="#059669" />
      <text x="20" y="0" font-family="Grandstander" font-size="20" font-weight="700" fill="#059669">
        Active Collar Tag
      </text>

      <circle cx="205" cy="-6" r="5" fill="#059669" />
      <text x="220" y="0" font-family="Grandstander" font-size="20" font-weight="700" fill="#059669">
        Vaccinated
      </text>

      <circle cx="360" cy="-6" r="5" fill="#059669" />
      <text x="375" y="0" font-family="Grandstander" font-size="20" font-weight="700" fill="#059669">
        Emergency Ready
      </text>
    </g>

    <!-- Microchip & Vitals -->
    <g transform="translate(0, 294)">
      <text x="0" y="0" font-family="Grandstander" font-size="15" font-weight="700" fill="#766A63" letter-spacing="1.5">
        MICROCHIP ID:
      </text>
      <text x="145" y="0" font-family="Grandstander" font-size="18" font-weight="800" fill="#2C211B">985-GRAXZO-2025-PUP</text>

      <text x="0" y="38" font-family="Grandstander" font-size="15" font-weight="700" fill="#766A63" letter-spacing="1.5">
        CARE NOTES:
      </text>
      <text x="130" y="38" font-family="Grandstander" font-size="18" font-weight="600" fill="#5F3E29">Playful, affectionate, and learning fast</text>
    </g>

    <!-- Domain Footer -->
    <g transform="translate(0, 412)">
      <text x="0" y="0" font-family="Grandstander" font-size="30" font-weight="900" fill="#2C211B">
        puplumepet.vercel.app
      </text>
      <text x="0" y="28" font-family="Grandstander" font-size="16" font-weight="600" fill="#766A63">
        Scan collar tag for live emergency contacts &amp; medical vault
      </text>
    </g>
  </g>
</svg>
