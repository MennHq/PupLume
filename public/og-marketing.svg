<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Warm Skin / Cream Tone Background (Zero Dark Brown) -->
    <linearGradient id="skinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="45%" stop-color="#FFF9F2"/>
      <stop offset="100%" stop-color="#F7ECE1"/>
    </linearGradient>
    <radialGradient id="peachSkinGlow" cx="15%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FCDDC7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFF9F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberSkinGlow" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFF9F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoPupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A27046"/>
      <stop offset="100%" stop-color="#734927"/>
    </linearGradient>
    <linearGradient id="logoLumeStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
    <filter id="softEditorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2C211B" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C211B" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- Clean Warm Skin Background -->
  <rect width="1200" height="630" fill="url(#skinBg)"/>
  <rect width="1200" height="630" fill="url(#peachSkinGlow)"/>
  <rect width="1200" height="630" fill="url(#amberSkinGlow)"/>

  <!-- Left Editorial Content Column (Seamless, No Nested Boxes) -->
  <g transform="translate(90, 75)">
    <!-- Official PupLume Logo + Textual Wordmark -->
    <g transform="translate(0, 0)">
      <!-- Official Squircle Icon (72x72) -->
      <rect width="72" height="72" rx="22" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="2" filter="url(#softEditorialShadow)"/>
      <g transform="translate(5, 4) scale(0.135)">
        <path d="M 220 80 C 130 80 70 140 70 240 C 70 330 140 380 220 380 C 300 380 370 330 370 240 C 370 140 310 80 220 80 Z" fill="url(#logoPupGrad)" />
        <path d="M 120 120 C 60 140 30 210 40 290 C 45 320 70 340 95 325 C 115 310 135 250 140 200 Z" fill="#5F3E29" />
        <path d="M 320 120 C 380 140 410 210 400 290 C 395 320 370 340 345 325 C 325 310 305 250 300 200 Z" fill="#5F3E29" />
        <ellipse cx="220" cy="275" rx="85" ry="70" fill="#FFF9F2" />
        <path d="M 195 240 C 195 230 245 230 245 240 C 245 258 228 272 220 272 C 212 272 195 258 195 240 Z" fill="#2C211B" />
        <ellipse cx="212" cy="238" rx="6" ry="3" fill="#FFFFFF" opacity="0.6" />
        <circle cx="165" cy="205" r="14" fill="#2C211B" />
        <circle cx="161" cy="201" r="5" fill="#FFFFFF" />
        <circle cx="275" cy="205" r="14" fill="#2C211B" />
        <circle cx="271" cy="201" r="5" fill="#FFFFFF" />
        <g transform="translate(295, 45)">
          <path d="M 40 0 C 40 22 58 40 80 40 C 58 40 40 58 40 80 C 40 58 22 40 0 40 C 22 40 40 22 40 0 Z" fill="url(#logoLumeStar)" />
          <circle cx="40" cy="40" r="10" fill="#FFF9F2" />
        </g>
      </g>

      <!-- Official Wordmark in Grandstander font -->
      <text x="90" y="44" font-family="Grandstander, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#2C211B" letter-spacing="-0.5">
        Pup<tspan fill="#8B5E3C">Lume</tspan>
      </text>
      <text x="92" y="66" font-family="Grandstander, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#766A63" letter-spacing="3.5">
        YOUR PUPPY DIGITAL HOME
      </text>
    </g>

    <!-- Headline (Clean, Bold, Grandstander) -->
    <text x="0" y="170" font-family="Grandstander, -apple-system, sans-serif" font-size="58" font-weight="900" fill="#2C211B" letter-spacing="-1.5">
      The Smart Dog Passport
    </text>
    <text x="0" y="235" font-family="Grandstander, -apple-system, sans-serif" font-size="58" font-weight="900" fill="#8B5E3C" letter-spacing="-1.5">
      &amp; AI Puppy Companion
    </text>

    <!-- Subtitle (Flowing, No Separate Boxes) -->
    <text x="0" y="295" font-family="Grandstander, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#5F3E29">
      Smart QR collar tags, AI care routines &amp; digital health records.
    </text>

    <!-- Feature Highlights (Clean bullet flow) -->
    <g transform="translate(0, 350)">
      <text x="0" y="0" font-family="Grandstander, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#8B5E3C">
        🏷️ Smart Collar QR Tag  •  🩺 Vaccine Vault  •  🚨 Missing Pet Alert
      </text>
    </g>

    <!-- Official URL Tag -->
    <g transform="translate(0, 415)">
      <text x="0" y="0" font-family="Grandstander, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#8B5E3C">
        puplumepet.vercel.app
      </text>
      <text x="290" y="-2" font-family="Grandstander, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#766A63">
        • Everything your puppy needs to thrive
      </text>
    </g>
  </g>

  <!-- Right Visual Feature (Single Clean Rounded Illustration, Zero Clutter) -->
  <g transform="translate(770, 75)" filter="url(#softEditorialShadow)">
    <rect width="340" height="480" rx="36" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="2"/>
    <rect x="20" y="20" width="300" height="280" rx="26" fill="#FFF9F2"/>
    <text x="170" y="180" font-size="110" text-anchor="middle">🐕</text>
    
    <g transform="translate(25, 330)">
      <text x="0" y="0" font-family="Grandstander, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#2C211B">Milo</text>
      <text x="0" y="30" font-family="Grandstander, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#8B5E3C">Golden Retriever • 5 mo</text>
      
      <!-- Verified Single Pill -->
      <g transform="translate(0, 48)">
        <rect width="200" height="34" rx="17" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.5"/>
        <text x="100" y="22" font-family="Grandstander, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#2E7D32" text-anchor="middle">
          ✓ SMART TAG ACTIVE
        </text>
      </g>
    </g>
  </g>
</svg>
