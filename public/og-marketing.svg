<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="mktBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1510"/>
      <stop offset="50%" stop-color="#2D1C13"/>
      <stop offset="100%" stop-color="#140D09"/>
    </linearGradient>
    <radialGradient id="mktGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mktGlow2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8B5E3C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5E3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#mktBg)"/>
  <rect width="1200" height="630" fill="url(#mktGlow)"/>
  <rect width="1200" height="630" fill="url(#mktGlow2)"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Brand Pill Header -->
  <g transform="translate(80, 70)">
    <rect width="260" height="42" rx="21" fill="rgba(243, 231, 218, 0.12)" stroke="rgba(243, 231, 218, 0.25)" stroke-width="1.5"/>
    <!-- Glowing Star -->
    <path d="M 30 13 C 30 17 33 21 37 21 C 33 21 30 25 30 29 C 30 25 27 21 23 21 C 27 21 30 17 30 13 Z" fill="url(#starGrad)"/>
    <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#F3E7DA" letter-spacing="2">PUPLUME COMPANION</text>
  </g>

  <!-- Headline -->
  <text x="80" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" letter-spacing="-1">The Smart Dog Passport</text>
  <text x="80" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#F3E7DA" letter-spacing="-1">&amp; AI Care Routine</text>

  <!-- Subheadline -->
  <text x="80" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#C5B8AF" width="600">
    Digital Collar QR Tag • Smart Health Vault • Potty &amp; Routine Tracker
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 375)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <text x="24" y="29" font-family="sans-serif" font-size="16">🏷️</text>
      <text x="52" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Smart Collar Tag</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(205, 0)">
      <rect width="200" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <text x="24" y="29" font-family="sans-serif" font-size="16">🩺</text>
      <text x="52" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Vaccine &amp; Records</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(420, 0)">
      <rect width="195" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <text x="24" y="29" font-family="sans-serif" font-size="16">🚨</text>
      <text x="52" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Lost Dog Broadcast</text>
    </g>
  </g>

  <!-- URL & Trust Footer -->
  <g transform="translate(80, 520)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F59E0B">puplume.pet</text>
    <text x="160" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#8E7E73">• Intelligent, warm, mobile-first puppy care</text>
  </g>

  <!-- Right Floating Visual Badge / Phone Card Mockup -->
  <g transform="translate(770, 75)" filter="url(#cardShadow)">
    <rect width="350" height="480" rx="36" fill="#FAF6F0" stroke="#E8DDD3" stroke-width="3"/>
    
    <!-- Mini Puppy Card inside -->
    <g transform="translate(25, 25)">
      <!-- Avatar background -->
      <rect width="300" height="230" rx="24" fill="#F3E7DA"/>
      <text x="150" y="130" font-size="80" text-anchor="middle">🐕</text>
      
      <!-- Pet Info -->
      <text x="10" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#2C211B">Milo</text>
      <text x="10" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#8B5E3C">Golden Retriever • 5 mo</text>

      <!-- Smart Tag Pill -->
      <rect x="10" y="330" width="160" height="32" rx="16" fill="#E8DDD3"/>
      <text x="25" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#5F3E29">🛡️ SMART TAG ACTIVE</text>

      <!-- Mini QR Emblem -->
      <g transform="translate(210, 315)">
        <rect width="80" height="80" rx="16" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="2"/>
        <text x="40" y="48" font-size="34" text-anchor="middle">📲</text>
        <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#766A63" text-anchor="middle">SCAN ME</text>
      </g>
    </g>
  </g>
</svg>
